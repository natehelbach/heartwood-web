<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heartwood offices</title>
<!-- Office map from the Claude Design project (ui_kits/website/ContactMap.html), embedded on About › Contact. -->
<style>
@font-face{font-family:"PP Right Serif Mono";src:url("/assets/fonts/PPRightSerifMono-Medium.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Freight Text";src:url("/assets/fonts/FreightText-Book.ttf") format("truetype");font-weight:400;font-display:swap}
:root{--hw-white:#F9F9F9;--hw-black:#212121;--hw-terracotta:#BC532D;--font-subhead:"PP Right Serif Mono",monospace;--font-body:"Freight Text",Georgia,serif}
</style>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
html,body{margin:0;background:transparent;overflow:hidden}
#wrap{position:relative;width:100%;aspect-ratio:16/10}
svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pin{cursor:pointer;outline:none}
.pin .ring{fill:none;stroke:var(--hw-terracotta,#BC532D);stroke-width:1.5;opacity:.6;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin .ring{animation:none}}
.tip{position:absolute;transform:translate(-50%,calc(-100% - 18px));background:var(--hw-white,#F9F9F9);color:var(--hw-black,#212121);border:1.5px solid var(--hw-black,#212121);padding:10px 14px;display:flex;flex-direction:column;gap:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.tip.on{opacity:1}
.tip b{font-family:var(--font-subhead);font-weight:500;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--hw-terracotta,#BC532D)}
.tip span{font-family:var(--font-body);font-size:16px;line-height:1.35}
.lbl{font-family:var(--font-subhead);font-weight:500;font-size:13px;letter-spacing:.04em;text-transform:uppercase;fill:var(--hw-black,#212121)}
</style>
</head>
<body>
<div id="wrap" role="img" aria-label="Map of Heartwood offices in Toronto and San Francisco"><svg id="map" viewBox="0 0 800 500"></svg></div>
<script>
(async()=>{
const W=800,H=500,STEP=9;
const offices=[
 {name:'Canada Office',addr:['25 King St W','Toronto, Ontario M5L 2A1'],ll:[-79.379,43.648],lx:12,ly:-12,anchor:'start'},
 {name:'US Office',addr:['San Francisco, California'],ll:[-122.419,37.775],lx:12,ly:-12,anchor:'start'}
];
const topo=await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')).json();
const feats=topojson.feature(topo,topo.objects.countries).features.filter(f=>['124','840','484'].includes(f.id));
const land={type:'FeatureCollection',features:feats};
const frame={type:'Feature',geometry:{type:'MultiPoint',coordinates:[[-127,24],[-64,24],[-127,56],[-64,56],[-96,58]]}};
const proj=d3.geoConicEqualArea().parallels([29.5,49]).rotate([97,0]).fitExtent([[20,20],[W-20,H-20]],frame);
const svg=d3.select('#map');
const g=svg.append('g');
const path=d3.geoPath(proj);
g.selectAll('path').data(feats).join('path').attr('d',path).attr('fill','#C5DCEA').attr('stroke','#F9F9F9').attr('stroke-width',1.2).attr('stroke-linejoin','round');
const wrap=document.getElementById('wrap');
offices.forEach(o=>{
 const [x,y]=proj(o.ll);
 const tip=document.createElement('div');tip.className='tip';
 tip.innerHTML='<b>'+o.name+'</b>'+o.addr.map(a=>'<span>'+a+'</span>').join('');
 tip.style.left=(x/W*100)+'%';tip.style.top=(y/H*100)+'%';wrap.appendChild(tip);
 const p=svg.append('g').attr('class','pin').attr('tabindex',0).attr('role','button').attr('aria-label',o.name+', '+o.addr.join(', '));
 p.append('circle').attr('class','ring').attr('cx',x).attr('cy',y).attr('r',9);
 p.append('circle').attr('cx',x).attr('cy',y).attr('r',18).attr('fill','transparent');
 p.append('circle').attr('cx',x).attr('cy',y).attr('r',6).attr('fill','#BC532D');
 p.append('text').attr('class','lbl').attr('x',x+o.lx).attr('y',y+o.ly).attr('text-anchor',o.anchor).text(o.name.replace(' Office',''));
 const on=()=>tip.classList.add('on'),off=()=>tip.classList.remove('on');
 p.on('mouseenter',on).on('mouseleave',off).on('focus',on).on('blur',off).on('click',()=>tip.classList.toggle('on'));
});
})();
</script>
</body>
</html>
